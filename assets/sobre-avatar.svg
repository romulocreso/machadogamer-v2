<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Machado Gamer — pôr do sol de Vice City">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c0836"/>
      <stop offset=".36" stop-color="#5b1a73"/>
      <stop offset=".60" stop-color="#c02f6b"/>
      <stop offset=".72" stop-color="#ff5c4d"/>
      <stop offset=".80" stop-color="#ffc24a"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".42" r=".62">
      <stop offset="0" stop-color="#fff3d2"/>
      <stop offset=".42" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#ff5c4d"/>
    </radialGradient>
    <clipPath id="circ"><circle cx="200" cy="200" r="198"/></clipPath>
  </defs>

  <g clip-path="url(#circ)">
    <rect width="400" height="400" fill="#0c0518"/>
    <rect width="400" height="322" fill="url(#sky)"/>

    <!-- sol + ripas -->
    <circle cx="200" cy="236" r="98" fill="url(#sun)"/>
    <g fill="#c02f6b" opacity=".45">
      <rect x="108" y="214" width="184" height="4"/>
      <rect x="100" y="226" width="200" height="5"/>
    </g>
    <g fill="#1c0836">
      <rect x="92" y="242" width="216" height="8"/>
      <rect x="90" y="258" width="220" height="11"/>
      <rect x="88" y="278" width="224" height="15"/>
      <rect x="86" y="302" width="228" height="20"/>
    </g>

    <!-- horizonte + chão -->
    <rect x="0" y="320" width="400" height="80" fill="#0b0416"/>
    <rect x="0" y="318" width="400" height="3" fill="#2de2e6"/>

    <!-- grade neon em perspectiva -->
