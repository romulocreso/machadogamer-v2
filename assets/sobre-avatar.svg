      <line x1="200" y1="320" x2="20"  y2="400"/>
      <line x1="200" y1="320" x2="120" y2="400"/>
      <line x1="200" y1="320" x2="200" y2="400"/>
      <line x1="200" y1="320" x2="280" y2="400"/>
      <line x1="200" y1="320" x2="380" y2="400"/>
      <line x1="200" y1="320" x2="490" y2="400"/>
      <line x1="0" y1="334" x2="400" y2="334"/>
      <line x1="0" y1="354" x2="400" y2="354"/>
      <line x1="0" y1="382" x2="400" y2="382"/>
    </g>

    <!-- palmeiras -->
    <g fill="#0b0416">
      <g transform="translate(70 324) scale(1.1)">
        <path d="M-4 0 C-9 -44 -6 -90 3 -138 C7 -90 6 -44 4 0 Z"/>
        <path d="M2 -138 C-24 -152 -56 -150 -84 -134 C-56 -164 -20 -170 2 -138 Z"/>
        <path d="M2 -138 C-12 -166 -38 -186 -68 -192 C-38 -194 -8 -174 2 -138 Z"/>
        <path d="M2 -138 C5 -168 3 -200 -9 -226 C15 -204 22 -168 2 -138 Z"/>
        <path d="M2 -138 C19 -164 46 -180 76 -184 C48 -164 21 -154 2 -138 Z"/>
