
name: Atualiza seguidores do Instagram

# Execução automática a cada 6 horas (UTC) e manual pelo GitHub Actions.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Evita duas execuções tentando gravar ao mesmo tempo.
concurrency:
  group: instagram-followers-update
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixa o repositório
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Consulta Instagram e atualiza o JSON, se houver mudanças
        shell: bash
        run: |
          set -euo pipefail

          USUARIO="machadogameroficial"
          ARQUIVO="data/instagram.json"

          if [[ ! -f "$ARQUIVO" ]]; then
            echo "::error::Arquivo $ARQUIVO não encontrado."
            exit 1
          fi

          ANT_SEGUIDORES=$(jq -r '.followers // ""' "$ARQUIVO")
          ANT_SEGUINDO=$(jq -r '.following // ""' "$ARQUIVO")
          ANT_POSTS=$(jq -r '.posts // ""' "$ARQUIVO")

          SEGUIDORES_EXATOS=""
          SEGUIDORES=""
          SEGUINDO="$ANT_SEGUINDO"
          POSTS="$ANT_POSTS"

          # Método 1: API não oficial.
          # Pode ser bloqueada pelo Instagram.
          if RESP=$(curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 \
            -H "x-ig-app-id: 936619743392459" \
            -H "User-Agent: Mozilla/5.0" \
            "https://i.instagram.com/api/v1/users/web_profile_info/?username=$USUARIO"); then

            SEGUIDORES_EXATOS=$(jq -r 'try (.data.user.edge_followed_by.count // empty) catch empty' <<< "$RESP" 2>/dev/null || true)
            API_SEGUINDO=$(jq -r 'try (.data.user.edge_follow.count // empty) catch empty' <<< "$RESP" 2>/dev/null || true)
            API_POSTS=$(jq -r 'try (.data.user.edge_owner_to_timeline_media.count // empty) catch empty' <<< "$RESP" 2>/dev/null || true)
          else
            CODIGO=$?
            echo "::warning::Consulta à API falhou (curl: código $CODIGO); tentando a página pública."
          fi

          if [[ "$SEGUIDORES_EXATOS" =~ ^[0-9]+$ ]]; then
            # Exemplo: 29345 -> 29,3K; 1200000 -> 1,2M.
            SEGUIDORES=$(LC_ALL=C awk -v n="$SEGUIDORES_EXATOS" 'BEGIN {
              if (n >= 1000000) { v = n / 1000000; s = "M" }
              else if (n >= 1000) { v = n / 1000; s = "K" }
              else { printf "%d", n; exit }
              r = sprintf("%.1f", v)
              sub(/\.0$/, "", r)
              sub(/\./, ",", r)
              printf "%s%s", r, s
            }')
            [[ "$API_SEGUINDO" =~ ^[0-9]+$ ]] && SEGUINDO="$API_SEGUINDO"
            [[ "$API_POSTS" =~ ^[0-9]+$ ]] && POSTS="$API_POSTS"
            echo "Instagram: contagem exata obtida pela API."
          else
            # Método 2: descrição pública do perfil.
            # Pode retornar a contagem já abreviada.
            if HTML=$(curl -fsSL --retry 2 --connect-timeout 10 --max-time 30 \
              -A "facebookexternalhit/1.1" \
              -H "Accept-Language: en-US,en;q=0.9" \
              "https://www.instagram.com/$USUARIO/"); then

              DESC=$(printf '%s' "$HTML" | grep -oP '<meta property="og:description" content="\K[^"]+' | head -n 1 || true)
              META_SEGUIDORES=$(printf '%s' "$DESC" | grep -oiP '[0-9][0-9.,]*[KMB]?(?=\s+(?:Followers|Seguidores))' | head -n 1 || true)

              if [[ -n "$META_SEGUIDORES" ]]; then
                SEGUIDORES="${META_SEGUIDORES//./,}"
                echo "Instagram: contagem abreviada obtida na página pública."
              fi
            else
              CODIGO=$?
              echo "::warning::Consulta à página falhou (curl: código $CODIGO)."
            fi
          fi

          # Sem dado novo, não altera o JSON.
          if [[ -z "$SEGUIDORES" ]]; then
            echo "::warning::Nenhuma contagem disponível. Último valor mantido: $ANT_SEGUIDORES."
            exit 0
          fi

          # Evita commits quando as contagens não mudaram.
          if [[ "$SEGUIDORES" == "$ANT_SEGUIDORES" && "$SEGUINDO" == "$ANT_SEGUINDO" && "$POSTS" == "$ANT_POSTS" ]]; then
            echo "Contagens inalteradas: $SEGUIDORES seguidores."
            exit 0
          fi

          DATA_ATUAL=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          jq \
            --arg seguidores "$SEGUIDORES" \
            --arg seguindo "$SEGUINDO" \
            --arg posts "$POSTS" \
            --arg atualizado "$DATA_ATUAL" \
            '.followers = $seguidores | .following = $seguindo | .posts = $posts | .updated = $atualizado' \
            "$ARQUIVO" > "${ARQUIVO}.tmp"

          mv "${ARQUIVO}.tmp" "$ARQUIVO"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$ARQUIVO"
          git commit -m "Instagram: atualiza seguidores (automático)"
          git push origin HEAD:main

          echo "Atualização concluída: $SEGUIDORES seguidores."
