
name: Atualiza seguidores do Instagram

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram-profile-update
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Ler perfil público e atualizar dados
        shell: bash
        run: |
          python3 - <<'PY'
          import html
          import json
          import re
          import subprocess
          import sys
          from datetime import datetime, timezone
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          USER = "machadogameroficial"
          PATH = Path("data/instagram.json")

          URLS = [
              f"https://www.instagram.com/{USER}/",
              f"https://www.instagram.com/{USER}/embed/",
          ]

          class ProfileHTML(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.metadata = []
                  self.scripts = []
                  self.in_script = False
                  self.parts = []

              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if tag == "meta" and (
                      a.get("name") or a.get("property") or ""
                  ).lower() in (
                      "description",
                      "og:description",
                      "twitter:description"
                  ):
                      self.metadata.append(a.get("content", ""))

                  if tag == "script":
                      self.in_script = True
                      self.parts = []

              def handle_endtag(self, tag):
                  if tag == "script" and self.in_script:
                      self.scripts.append("".join(self.parts))
                      self.in_script = False

              def handle_data(self, data):
                  if self.in_script:
                      self.parts.append(data)

          def count(v):
              if isinstance(v, dict):
                  v = v.get("count")

              if isinstance(v, bool):
                  return None

              if isinstance(v, int) and v >= 0:
                  return v

              if isinstance(v, str) and v.isdecimal():
                  return int(v)

              return None

          def field(obj, keys):
              for k in keys:
                  n = count(obj.get(k))
                  if n is not None:
                      return n
              return None

          def find_own_profile(obj, depth=0):
              if depth > 55:
                  return None

              if isinstance(obj, dict):
                  username = obj.get("username")

                  if (
                      isinstance(username, str)
                      and username.casefold() == USER
                  ):
                      n = field(obj, (
                          "follower_count",
                          "followers_count",
                          "edge_followed_by"
                      ))

                      if n is not None:
                          return (
                              n,
                              field(obj, (
                                  "following_count",
                                  "follows_count",
                                  "edge_follow"
                              )),
                              field(obj, (
                                  "media_count",
                                  "posts_count",
                                  "edge_owner_to_timeline_media"
                              )),
                              True,
                          )

                  for v in obj.values():
                      result = find_own_profile(v, depth + 1)
                      if result:
                          return result

              elif isinstance(obj, list):
                  for v in obj:
                      result = find_own_profile(v, depth + 1)
                      if result:
                          return result

              elif (
                  isinstance(obj, str)
                  and obj.lstrip().startswith(('{', '['))
                  and USER in obj
              ):
                  try:
                      return find_own_profile(
                          json.loads(obj), depth + 1
                      )
                  except ValueError:
                      pass

              return None

          NUMBER = (
              r'(\d[\d.,\s]*\s*'
              r'(?:[KMB]|mil(?:h(?:ão|ões))?)?)'
          )

          def labelled(text, label):
              m = re.search(
                  rf'(?<!\w){NUMBER}\s*(?:{label})\b',
                  text,
                  re.I
              )
              return m.group(1) if m else None

          def parse_human(text):
              if not text:
                  return None

              s = re.sub(r'\s+', '', text).casefold()

              m = re.fullmatch(
                  r'(\d[\d.,]*)(k|m|b|mil|milhão|milhões)?',
                  s
              )

              if not m:
                  return None

              digits, suffix = m.groups()

              if suffix:
                  if digits.count('.') + digits.count(',') > 1:
                      return None

                  multiplier = {
                      'k': 1000,
                      'mil': 1000,
                      'm': 1000000,
                      'milhão': 1000000,
                      'milhões': 1000000,
                      'b': 1000000000
                  }[suffix]

                  return (
                      int(round(
                          float(digits.replace(',', '.'))
                          * multiplier
                      )),
                      False
                  )

              if '.' in digits or ',' in digits:
                  parts = re.split(r'[.,]', digits)

                  if not all(
                      len(p) == 3 for p in parts[1:]
                  ):
                      return None

                  digits = ''.join(parts)

              return int(digits), True

          def extract(text):
              parser = ProfileHTML()
              parser.feed(text)

              # Procura JSON estruturado do perfil correto.
              for script in parser.scripts:
                  if script.lstrip().startswith(('{', '[')):
                      try:
                          result = find_own_profile(
                              json.loads(script)
                          )
                      except ValueError:
                          result = None

                      if result:
                          return result

              # Alternativa: metadados públicos da página.
              if USER in text.casefold():
                  for meta in parser.metadata:
                      followers = parse_human(
                          labelled(
                              html.unescape(meta),
                              'followers|seguidores'
                          )
                      )

                      if followers:
                          following = parse_human(
                              labelled(
                                  meta,
                                  'following|seguindo'
                              )
                          )

                          posts = parse_human(
                              labelled(
                                  meta,
                                  'posts|publicações'
                              )
                          )

                          return (
                              followers[0],
                              following[0] if following else None,
                              posts[0] if posts else None,
                              followers[1]
                          )

              return None

          def fetch(url):
              req = Request(
                  url,
                  headers={
                      'User-Agent': (
                          'Mozilla/5.0 '
                          '(Windows NT 10.0; Win64; x64) '
                          'AppleWebKit/537.36 '
                          'Chrome/131.0 Safari/537.36'
                      ),
                      'Accept-Language': (
                          'pt-BR,pt;q=0.9,en-US;q=0.8'
                      ),
                      'Accept': (
                          'text/html,application/xhtml+xml'
                      ),
                  }
              )

              try:
                  with urlopen(req, timeout=25) as response:
                      text = response.read(
                          2_000_000
                      ).decode('utf-8', 'replace')

                      print(
                          f'{url}: HTTP {response.status}; '
                          f'{len(text)} caracteres.'
                      )

                      return text

              except HTTPError as error:
                  print(f'{url}: HTTP {error.code}.')

                  if error.code == 429:
                      print(
                          '::warning::Instagram limitou '
                          'as requisições; nenhuma repetição '
                          'imediata será feita.'
                      )

              except (
                  URLError,
                  OSError,
                  TimeoutError
              ) as error:
                  print(
                      f'{url}: problema de conexão: '
                      f'{str(error)[:150]}'
                  )

              return None

          def abbreviate(n):
              if n < 1000:
                  return str(n)

              if n >= 1000000:
                  divisor, suffix = 1000000, 'M'
              else:
                  divisor, suffix = 1000, 'K'

              return (
                  f'{n/divisor:.1f}'
                  .removesuffix('.0')
                  .replace('.', ',')
                  + suffix
              )

          def main():
              if not PATH.is_file():
                  print(
                      '::error::data/instagram.json '
                      'não encontrado.'
                  )
                  return 1

              result = None
              source = ''

              # Busca os dados reais no Instagram.
              for url in URLS:
                  content = fetch(url)

                  if not content:
                      continue

                  result = extract(content)

                  if result and result[0] > 0:
                      source = url
                      break

                  result = None

                  print(
                      '::notice::Página recebida, mas '
                      'sem contagem verificável do perfil.'
                  )

              if not result:
                  print(
                      '::error::A página do Instagram não '
                      'forneceu seguidores verificáveis. '
                      'JSON anterior preservado.'
                  )
                  return 1

              followers, following, posts, exact = result

              old = json.loads(
                  PATH.read_text(encoding='utf-8')
              )

              new = dict(old)

              # Número obtido da consulta, nunca fixado.
              new['followers'] = abbreviate(followers)

              if exact:
                  new['followers_exact'] = followers
              else:
                  new.pop('followers_exact', None)

              if following is not None:
                  new['following'] = str(following)

              if posts is not None:
                  new['posts'] = str(posts)

              new['updated'] = datetime.now(
                  timezone.utc
              ).strftime('%Y-%m-%dT%H:%M:%SZ')

              new['source'] = source

              PATH.write_text(
                  json.dumps(
                      new,
                      ensure_ascii=False,
                      indent=2
                  ) + '\n',
                  encoding='utf-8'
              )

              print(
                  f'Seguidores obtidos da página: '
                  f'{new["followers"]} '
                  f'(exatos: {exact}).'
              )

              # Configuração do GitHub Actions.
              subprocess.run([
                  'git', 'config',
                  'user.name',
                  'github-actions[bot]'
              ], check=True)

              subprocess.run([
                  'git', 'config',
                  'user.email',
                  '41898282+github-actions[bot]@users.noreply.github.com'
              ], check=True)

              subprocess.run([
                  'git', 'add', str(PATH)
              ], check=True)

              has_change = subprocess.run([
                  'git', 'diff',
                  '--cached', '--quiet'
              ], check=False).returncode

              if has_change == 0:
                  print('Nenhuma mudança no JSON.')
                  return 0

              if has_change != 1:
                  print(
                      '::error::Erro ao verificar '
                      'diferenças no Git.'
                  )
                  return 1

              subprocess.run([
                  'git', 'commit',
                  '-m',
                  'Instagram: atualiza seguidores do perfil público'
              ], check=True)

              subprocess.run([
                  'git', 'push',
                  'origin',
                  'HEAD:main'
              ], check=True)

              return 0

          if __name__ == '__main__':
              sys.exit(main())
          PY
